name: Release

# Builds the desktop apps on native runners and attaches them to a GitHub
# Release. Windows installers cannot be produced reliably from macOS — NSIS
# needs Wine — so each platform is built on its own machine.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: dist:mac
            artifacts: "release/*.dmg release/*.zip release/latest-mac.yml"
          - os: windows-latest
            command: dist:win
            artifacts: "release/*.exe release/latest.yml"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build the desktop app
        run: npm run ${{ matrix.command }}
        env:
          # Publishing is done by the release step below, not by electron-builder.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip signing until certificates exist; the app still builds and runs,
          # it just shows the unknown-developer warning on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach the builds to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
